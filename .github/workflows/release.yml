name: Release

# Pushing a version tag, such as v0.1.0, on main builds the release zips and
# creates a draft GitHub release with them. Check the draft, then publish it.
# A tag with a hyphen (v0.2.0-beta.1) makes a prerelease.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # One entry per platform. Each needs a target in
        # scripts/build-release.js first; only Windows has one so far.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All history, to check the tag is on main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Check the tag is on main and matches package.json
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Releases are tagged on main, after the release branch is merged."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match version $version in package.json."
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/RELEASE_NOTES.md

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "Claude Agents $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
