name: macOS terminals

# Drives the macOS terminals on a macOS runner with a stand-in session, as
# `npm run check-terminals` does on a Mac: opening a tab, going to it, reading
# its title, Catch up and Stop. Runs when the terminal drivers change, or by
# hand from the Actions tab.
#
# kitty and WezTerm aren't checked here: they need OpenGL, which the runner's
# virtual machine doesn't have, so neither can open a window. They're checked
# on Linux, and on a real Mac with `npm run check-terminals`.
on:
  workflow_dispatch:
  pull_request:
    paths: ['lib/terminals/**', 'scripts/check-terminals.js', 'scripts/stand-in-session.js', '.github/workflows/macos-terminals.yml']

permissions:
  contents: read

jobs:
  terminals:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install the terminals
        run: |
          brew install tmux >/dev/null
          brew install --cask iterm2 ghostty >/dev/null
          # A Mac in use knows its apps and has asked before their first
          # launch. A fresh runner hasn't: AppleScript finds apps through
          # macOS's index, and macOS would ask, with nobody to answer.
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          for app in iTerm Ghostty; do
            xattr -dr com.apple.quarantine "/Applications/$app.app" 2>/dev/null || true
            "$lsregister" -f "/Applications/$app.app"
          done
      - name: Allow driving them
        # On a Mac, macOS asks once whether to allow it. Here nobody can
        # answer, so it's allowed up front for the runner's agent, which
        # macOS holds responsible for the step's processes.
        run: |
          db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          for target in com.apple.Terminal com.googlecode.iterm2 com.mitchellh.ghostty; do
            sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, flags, last_modified) VALUES ('kTCCServiceAppleEvents', '/opt/hca/hosted-compute-agent', 1, 2, 3, 1, 0, '$target', 0, CAST(strftime('%s','now') AS INTEGER));"
          done
          killall tccd 2>/dev/null || true
      - name: Start the terminals
        # Running, as they would be on a Mac in use; Terminal shows tmux.
        timeout-minutes: 3
        run: |
          open -a Terminal && sleep 5
          osascript -e 'tell application "Terminal" to do script "tmux new-session -A -s main"'
          open -a iTerm && open -a Ghostty
          sleep 10
      - name: Check every terminal
        timeout-minutes: 15
        env:
          TABHERD_DEBUG: '1'
        run: |
          node scripts/check-terminals.js terminal iterm2 ghostty tmux | tee check.txt
          if grep -E '^  [a-zA-Z]+ +(no|opened|typed)' check.txt; then
            echo "::error::Not every check passed."
            exit 1
          fi
