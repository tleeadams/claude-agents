name: macOS terminals

# Drives Terminal on a macOS runner with a stand-in session, as
# `npm run check-terminals` does on a Mac: opening a window, going to its tab,
# reading its title, Catch up and Stop. Runs when the terminal drivers change,
# or by hand from the Actions tab.
on:
  workflow_dispatch:
  pull_request:
    paths: ['lib/terminals/**', 'scripts/check-terminals.js', 'scripts/stand-in-session.js']
  push:
    branches: ['bugfix/macos-**']

permissions:
  contents: read

jobs:
  terminal:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Allow driving Terminal
        # On a Mac, macOS asks once whether to allow it; here nobody can
        # answer, so the permission is granted up front for the processes
        # that could be asking.
        run: |
          echo "Processes above this step:"
          p=$$; while [ "$p" -gt 1 ]; do ps -o pid=,ppid=,comm= -p "$p"; p=$(ps -o ppid= -p "$p" | tr -d ' '); done
          db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          for client in /usr/bin/osascript /bin/bash /bin/sh "$(command -v node)" $(ps -A -o comm= | grep -E 'Runner\.(Worker|Listener)$' | sort -u); do
            for target in com.apple.Terminal com.apple.systemevents; do
              sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, flags, last_modified) VALUES ('kTCCServiceAppleEvents', '$client', 1, 2, 3, 1, 0, '$target', 0, CAST(strftime('%s','now') AS INTEGER));" \
                && echo "allowed $client -> $target" || echo "couldn't allow $client -> $target"
            done
          done
      - name: Check Terminal and tmux
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux >/dev/null
          node scripts/check-terminals.js terminal tmux | tee check.txt
          # Every line for Terminal should say yes.
          if awk '/^Terminal:/{t=1;next} /^[A-Za-z]/{t=0} t && $2 != "yes" && $2 != "yes," {bad=1} END{exit !bad}' check.txt; then
            echo "::error::Terminal didn't pass every check."
            exit 1
          fi
      - name: What macOS's privacy checks said
        if: failure()
        run: log show --last 15m --predicate 'subsystem == "com.apple.TCC"' --style compact 2>/dev/null | grep -iE 'AppleEvents|responsible|attribution' | tail -40
